[workspace]
resolver = "3"
members = ["crates/*", "tools/layer-check"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rhyslos/Aventail-3D"
authors = ["Rhyslos"]
publish = false

# Internal crates, so any crate can depend on another by name.
# Crate names are generic on purpose (no product name), so renaming the app
# never touches them; see RENAMING.md.
# Which crate may depend on which is decided by layers (see ARCHITECTURE.md)
# and enforced by the test in tools/layer-check.
[workspace.dependencies]
words = { path = "crates/words" }
mesh = { path = "crates/mesh" }
uv = { path = "crates/uv" }
booleans = { path = "crates/booleans" }
paint = { path = "crates/paint" }
scene = { path = "crates/scene" }
config = { path = "crates/config" }
fileio = { path = "crates/fileio" }
render = { path = "crates/render" }
tools = { path = "crates/tools" }
ui = { path = "crates/ui" }

# Outside libraries. Every one must pass `cargo deny check` (see deny.toml),
# and must have a permissive license (see docs/decisions/0004-gpl-license.md).
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
# Vector maths. Must match the glam version used elsewhere in the workspace.
glam = { version = "0.34", features = ["serde", "bytemuck"] }
# Must match the wgpu version eframe uses (one GPU device is shared).
wgpu = "30.0"
bytemuck = { version = "1.25", features = ["derive"] }
# The window and frame loop (winit + wgpu underneath); see
# docs/decisions/0008-window-and-panels.md.
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
# The .avtl project file: a compact binary encoding of the file model and
# zstd compression; see docs/decisions/0024-saving-projects.md.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
zstd = { version = "0.14", default-features = false }
# Reading images painted in other programs (PNG, JPEG, TGA, BMP) as
# paint layers; MIT or Apache-2.0. See docs/decisions/0177-texture-painter-plan.md.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
# The development project format (version 39 on): self-describing, so it
# can grow until the alpha without new versions; see
# docs/decisions/0126-rework-and-first-use.md.
ciborium = "0.2"
# The JSON part of glTF exports; see docs/decisions/0072-gltf-export.md.
serde_json = "1.0"
# MikkTSpace tangents for exports, the standard Substance Painter and
# Godot use; see docs/decisions/0073-mikktspace-tangents.md.
bevy_mikktspace = "1.0"
# Native Open and Save dialogs (Windows, macOS, and Linux through the
# desktop portal, so no GTK is needed).
rfd = "0.17"
# The system language, to guess the keyboard drawn in the Keys window.
sys-locale = "0.3"
# Windows only: giving the window keyboard focus (decision 0026). The same
# versions the window library already uses.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }
raw-window-handle = "0.6"
# Windows only: pen tablets through Wintab: wintab_lite's types (without
# its own loading, which needs more of the windows crate than it asks
# for), and libloading to load the driver at run time, so the app starts
# without one; MIT and ISC. See docs/decisions/0184-brush-feel.md.
wintab_lite = "1.0.1"
libloading = "0.8"
# Booleans between closed shapes: a pure-Rust port of Manifold, so no C++
# toolchain is needed; see docs/decisions/0135-live-booleans.md.
manifold-rust = { version = "0.18", default-features = false }
# Development only.
egui_kittest = "0.36"
ron = "0.12"
pollster = "1.0"

[workspace.lints.rust]
# Ground rule 6: no unsafe code. "deny" rather than "forbid" so that the
# few reviewed exceptions, each with its own decision record, can allow it
# on one small module (see docs/decisions/0026-windows-keyboard-focus.md).
unsafe_code = "deny"
# Documentation rule: every public item must be documented.
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Ground rule 7: library code never crashes on purpose.
# Tests are exempt through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep debug builds usable: optimise dependencies even in development,
# so the viewport stays smooth while working on the app.
[profile.dev.package."*"]
opt-level = 2
