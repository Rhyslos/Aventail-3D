[package]
name = "render"
description = "The viewport renderer: shaded meshes, wireframe, grid, picking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.architecture]
layer = 3

[dependencies]
# Meshes to draw (layer 0).
mesh.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true

[dev-dependencies]
pollster.workspace = true
# Same layer; used to aim the camera in GPU tests.
tools.workspace = true

[lints]
workspace = true
