[package]
name = "app"
description = "The application: wires every crate together and owns the frame loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.architecture]
layer = 4

# The executable's file name. Listed in RENAMING.md.
[[bin]]
name = "aventail"
path = "src/main.rs"

[dependencies]
ui.workspace = true
fileio.workspace = true
rfd.workspace = true
render.workspace = true
eframe.workspace = true

[lints]
workspace = true
