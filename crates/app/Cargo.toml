[package]
name = "app"
description = "The application: wires every crate together and owns the frame loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.architecture]
layer = 4

# The executable's file name. Listed in RENAMING.md.
[[bin]]
name = "aventail"
path = "src/main.rs"

[dependencies]
# Painted textures uploaded to the GPU (decision 0177).
paint.workspace = true
ui.workspace = true
# Meshes kept on the GPU per object, updated where points moved.
mesh.workspace = true
glam.workspace = true
fileio.workspace = true
# Backup copies are written from a copy of the document.
scene.workspace = true
# The language layer for the app's own text (dialogs, start-up).
words.workspace = true
rfd.workspace = true
# The system language, to guess the keyboard the Keys window draws.
sys-locale.workspace = true
render.workspace = true
eframe.workspace = true
# Reads GitHub's answer about the latest release (decision 0169).
serde_json.workspace = true

[dev-dependencies]
# Aims the camera in tests.
tools.workspace = true

# Puts the logo on the Windows program file (build.rs, decision 0171).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
raw-window-handle.workspace = true
# Pen tablets through Wintab (decision 0184).
wintab_lite.workspace = true
libloading.workspace = true

[lints]
workspace = true
