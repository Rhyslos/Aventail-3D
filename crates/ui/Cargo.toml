[package]
name = "ui"
description = "The interface: dockable panels, menus, palettes and theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.architecture]
layer = 3

[dependencies]
# Same layer: the camera the viewport looks through.
tools.workspace = true
# The scene document: objects, commands and undo.
scene.workspace = true
glam.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
ron.workspace = true

[lints]
workspace = true
