[package]
name = "ui"
description = "The interface: dockable panels, menus, palettes and theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.architecture]
layer = 3

[dependencies]
# Same layer: the camera the viewport looks through.
tools.workspace = true
# The scene document: objects, commands and undo.
scene.workspace = true
# Texture sets, their layers and mixing them (decision 0177).
paint.workspace = true
# Maps baked from the shape itself, for the painter (decision 0192).
bake.workspace = true
# What exports and imports take and give (layer 2); the app does the
# writing and reading.
fileio.workspace = true
# Primitive settings' limits and the mesh check (layer 0).
mesh.workspace = true
# Suggested seams (layer 1).
uv.workspace = true
# The language layer every text goes through (layer 0).
words.workspace = true
glam.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true

[dev-dependencies]
# With "snapshot" and "wgpu": reference images of the main panels and
# windows, drawn on the GPU (decision 0126; the tests skip without one).
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
ron.workspace = true

[lints]
workspace = true
