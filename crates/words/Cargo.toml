[package]
name = "words"
description = "The app's words through one language layer: English as the key, other languages as packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.architecture]
layer = 0

# No dependencies, on purpose: every crate that makes text a person reads
# (mesh at the bottom, the interface at the top) uses this one.
[dependencies]

[lints]
workspace = true
