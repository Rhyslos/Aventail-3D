# Runs on every pull request and every change to main.
# Nothing merges while any job here is red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Failing tests and their messages are also shown as annotations on
      # the pull request, so they can be read without opening the log.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --locked --no-fail-fast 2>&1 | tee test-output.txt; then
            grep -E -A3 "panicked at|^test .* FAILED|---- .* stdout ----" test-output.txt \
              | head -n 60 > failures.txt || true
            msg="$(cat failures.txt)"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Tests failed on ${{ runner.os }}::${msg}"
            exit 1
          fi
      # The lint job runs on Linux, so code that only exists on Windows
      # (app/src/platform.rs, decision 0026) is linted here.
      - name: cargo clippy (Windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy -p app --all-targets --locked -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      # Broken links or malformed docs fail the build.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps --locked

  window-smoke:
    name: Window and GPU tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A virtual screen, a software Vulkan driver, and tools to click and
      # take screenshots.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers libxkbcommon-x11-0
      - run: cargo build --locked -p app
      # GPU rendering tests: here a missing GPU is a failure, not a skip.
      - run: cargo test --locked -p render --test gpu
        env:
          REQUIRE_GPU: "1"
      # The window title is the app's name (APP_NAME in branding.rs);
      # listed in RENAMING.md.
      - run: xvfb-run -s "-screen 0 1440x900x24" tools/smoke/window-smoke.sh target/debug/aventail "Aventail 3D" smoke-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: window-screenshot
          path: smoke-output/
          retention-days: 14

  deny:
    name: Licenses and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The executable's name; listed in RENAMING.md.
          - name: windows
            os: windows-latest
            binary: aventail.exe
          - name: linux
            os: ubuntu-latest
            binary: aventail
          - name: macos
            os: macos-latest
            binary: aventail
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p app
      # Put the program and its license files side by side in one flat folder,
      # so the downloaded zip opens straight to the program.
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.binary }}" LICENSE NOTICE dist/
          cp -r licenses dist/licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry when code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTERNAL: ${{ contains(github.event.pull_request.labels.*.name, 'internal') }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"; echo "$changed"
          if [ "$INTERNAL" = "true" ]; then
            echo "Labelled 'internal': no changelog entry required."
            exit 0
          fi
          if echo "$changed" | grep -qE '^(crates/|tools/|Cargo\.(toml|lock)$)'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::Code changed but CHANGELOG.md did not. Add an entry, or label the pull request 'internal' if users would not notice."
              exit 1
            fi
          fi
          echo "Changelog check passed."
